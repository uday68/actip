name: Ingestion Service CI

on:
  push:
    paths:
      - 'services/ingestion-java/**'
      - '.github/workflows/ingestion-ci.yml'
  pull_request:
    paths:
      - 'services/ingestion-java/**'
      - '.github/workflows/ingestion-ci.yml'

jobs:
  test:
    name: Gradle Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run JUnit 5 Normalizer Tests
        working-directory: services/ingestion-java
        run: gradle test --no-daemon --info
